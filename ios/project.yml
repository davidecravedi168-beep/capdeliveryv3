name: CAPDelivery
options:
  bundleIdPrefix: it.capdelivery
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CAPDelivery:
    type: application
    platform: iOS
    sources:
      - path: CAPDelivery
        excludes:
          - PrivacyInfo.xcprivacy
    resources:
      - path: CAPDelivery/PrivacyInfo.xcprivacy
    info:
      path: CAPDelivery/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.capdelivery.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
