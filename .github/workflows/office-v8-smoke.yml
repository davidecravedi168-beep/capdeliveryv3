name: Office V8 smoke
on:
  pull_request:
    paths:
      - 'office/**'
      - '.github/workflows/office-v8-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check office/state-v8.js
          node --check office/api-v8.js
          node --check office/app-v8.js
      - name: Discover free runtime POST contract
        run: |
          set -u
          BASE='https://br-floral-shadow-aygwywoy-officefree.compute.c-5.us-east-2.aws.neon.tech'
          echo '=== health ==='
          curl --fail --silent --show-error "$BASE/health"; echo
          payload='{"prompt":"Rispondi solo OK","messages":[{"role":"user","content":"Rispondi solo OK"}],"text":"Rispondi solo OK","task":"Rispondi solo OK"}'
          found=0
          for path in / /v1/chat/completions /v1/responses /v1/generate /v1/complete /v1/ask /v1/run /chat/completions /completions /responses /generate /generate-text /ask /complete /completion /run /work /task /respond /inference /infer /free /free/chat /runtime /api /api/chat /api/generate /api/complete /api/ai /api/v1/chat /api/v1/generate /api/v1/completions /text /ai /agent /agent/run /agent/execute /office /office/run /office/chat /officefree /officefree/chat /orchestrate /execute /prompt /query; do
            code=$(curl --silent --show-error -X POST "$BASE$path" -H 'Content-Type: application/json' --data "$payload" -o /tmp/probe.txt -w '%{http_code}' || true)
            body=$(head -c 1800 /tmp/probe.txt | tr '\n' ' ')
            echo "$code $path $body"
            if [ "$code" != "404" ]; then found=1; break; fi
          done
          test "$found" = "1"
      - name: Known paid Gateway limitation
        if: always()
        run: |
          curl --silent --show-error 'https://br-floral-shadow-aygwywoy-officev8.compute.c-5.us-east-2.aws.neon.tech/health' || true