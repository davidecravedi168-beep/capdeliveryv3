name: Office V8 smoke
on:
  pull_request:
    paths:
      - 'office/**'
      - '.github/workflows/office-v8-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check office/state-v8.js
          node --check office/api-v8.js
          node --check office/app-v8.js
      - name: Discover free runtime POST contract
        run: |
          set -u
          BASE='https://br-floral-shadow-aygwywoy-officefree.compute.c-5.us-east-2.aws.neon.tech'
          echo '=== health ==='
          curl --fail --silent --show-error "$BASE/health"; echo
          payload='{"prompt":"Rispondi solo OK","messages":[{"role":"user","content":"Rispondi solo OK"}],"text":"Rispondi solo OK","task":"Rispondi solo OK"}'
          found=0
          for path in /v1/chat/completions /generate /ask /complete /completion /run /api/chat /api/generate /text /ai /agent /office /orchestrate /execute /prompt /query; do
            code=$(curl --silent --show-error -X POST "$BASE$path" -H 'Content-Type: application/json' --data "$payload" -o /tmp/probe.txt -w '%{http_code}' || true)
            body=$(head -c 1600 /tmp/probe.txt | tr '\n' ' ')
            echo "$code $path $body"
            if [ "$code" != "404" ]; then found=1; break; fi
          done
          test "$found" = "1"
      - name: Known paid Gateway limitation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://br-floral-shadow-aygwywoy-officev8.compute.c-5.us-east-2.aws.neon.tech/health' -o /tmp/health.json
          cat /tmp/health.json