name: Validate The Office V8
on:
  push:
    paths:
      - 'office/**'
      - 'tests/office-*.test.cjs'
      - '.github/workflows/validate-office-v8.yml'
  pull_request:
    paths:
      - 'office/**'
      - 'tests/office-*.test.cjs'
      - '.github/workflows/validate-office-v8.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check office/ai-core.js
      - run: node --check office/app-v8.js
      - run: node --check office/runtime-v81.js
      - run: node --check office/runtime-v82.js
      - run: node tests/office-ai-core.test.cjs
      - run: node tests/office-v8-shell.test.cjs
      - run: node tests/office-v81-puter.test.cjs
      - run: node tests/office-v82-puter.test.cjs
