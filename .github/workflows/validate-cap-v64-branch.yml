name: Validate CAP 6.4 Branch

on:
  push:
    branches: [dev-cap-v64-finalization]

permissions:
  contents: read

concurrency:
  group: cap-v64-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply migrations in disposable workspace
        run: |
          python scripts/upgrade_cap_v6.py
          python scripts/upgrade_cap_v62.py
          python scripts/upgrade_cap_v63.py
          python scripts/upgrade_cap_v64.py
      - name: Test pass A
        run: |
          node tests/cap-ops-core.test.cjs
          node tests/cap-office-core.test.cjs
          node tests/cap-enterprise-core.test.cjs
          node tests/cap-planning-horizon.test.cjs
          node tests/data-ownership-v64.test.cjs
      - name: Test pass B reversed
        run: |
          node tests/data-ownership-v64.test.cjs
          node tests/cap-planning-horizon.test.cjs
          node tests/cap-enterprise-core.test.cjs
          node tests/cap-office-core.test.cjs
          node tests/cap-ops-core.test.cjs
      - name: Browser syntax
        run: |
          node --check cap-ops-core.js
          node --check cap-ops-layer.js
          node --check cap-tp-route-layer.js
          node --check cap-office-core.js
          node --check cap-office-bridge.js
          node --check cap-enterprise-core.js
          node --check cap-enterprise-layer.js
          node --check cap-planning-horizon.js
          node --check cap-planning-horizon-layer.js
      - name: Contract and duplication guard
        run: |
          grep -q 'CAP Delivery 6.4 · Transit Point Operating System' index.html
          grep -q 'cap-planning-horizon.css' index.html
          grep -q 'cap-planning-horizon.js' index.html
          grep -q 'syncPlanningHorizon(out,entity,f.name)' index.html
          grep -q 'APP AUTISTI · EVIDENZA ESTERNA' cap-tp-route-layer.js
          grep -q 'NO_MANUAL_DUPLICATION' DATA_OWNERSHIP_V64.md || grep -q 'must not be requested a second time' DATA_OWNERSHIP_V64.md
          ! grep -q 'captp-temp' cap-tp-route-layer.js
          git diff --check
