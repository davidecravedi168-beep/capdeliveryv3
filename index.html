<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#10151A">
<meta name="description" content="CAP Delivery — Console operativa">
<title>CAP Delivery — Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#10151A;
  --surface:#1A2129;
  --surface-2:#222B35;
  --surface-3:#2A3541;
  --line:#2E3944;
  --ink:#EDF1F5;
  --ink-dim:#8FA0AF;
  --ink-faint:#5C6B78;
  --amber:#F2A93B;
  --amber-ink:#3D2B04;
  --green:#33C481;
  --red:#F0553F;
  --blue:#4C9BE8;
  --violet:#9D7FE8;
  --gray-chip:#3A4552;
  --radius:10px;
  --radius-lg:16px;
  font-size:16px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
}

button,input{
  font:inherit;
}

#login-root{
  width:100%;
  max-width:480px;
  min-height:100vh;
}

#app{
  width:100%;
  max-width:1180px;
  min-height:100vh;
  background:var(--bg);
  display:none;
  flex-direction:column;
  position:relative;
}

h1,h2,h3,.disp{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
}

.mono{
  font-family:'JetBrains Mono',monospace;
}

/* TOPBAR */

.topbar{
  padding:18px 18px 12px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:20;
}

.topbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand .mark,
.login-brand .mark{
  width:10px;
  height:10px;
  border-radius:2px;
  background:var(--amber);
  display:inline-block;
}

.brand-title{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:22px;
  text-transform:uppercase;
  letter-spacing:.03em;
}

.brand-sub{
  font-size:10px;
  color:var(--ink-faint);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.date-chip{
  font-size:11px;
  color:var(--ink-dim);
  text-align:right;
  line-height:1.45;
}

.date-chip b{
  color:var(--ink);
}

.userbar{
  margin-top:3px;
}

.userbar-name{
  font-size:10px;
  color:var(--ink-dim);
}

.logout-link{
  font-size:10px;
  color:var(--amber);
  cursor:pointer;
  margin-left:6px;
}

/* SYNC */

.sync-chip{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  margin-top:3px;
  font-size:9px;
  color:var(--ink-faint);
}

.sync-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
}

/* TICKER */

.ticker{
  margin-top:12px;
  background:var(--surface-2);
  border:1px solid var(--red);
  border-left:4px solid var(--red);
  border-radius:8px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.ticker.hidden{
  display:none;
}

.ticker-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  flex-shrink:0;
  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

.ticker-text{
  font-size:12px;
  flex:1;
}

.ticker-text b{
  color:var(--red);
}

.ticker-arrow{
  color:var(--ink-faint);
}

/* OPERATIONAL STRIP */

.operational-strip{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 18px 0;
  padding:9px 11px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  font-size:11px;
  color:var(--ink-dim);
}

.operational-strip .live{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:var(--green);
  font-weight:700;
}

.operational-strip .live:before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
}

/* SCREEN */

.screen{
  flex:1;
  overflow-y:auto;
  padding:16px 18px 100px;
}

.screen::-webkit-scrollbar{
  display:none;
}

/* KPI */

.kpi-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.kpi-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:14px;
}

.kpi-label{
  font-size:10px;
  color:var(--ink-faint);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-bottom:6px;
}

.kpi-value{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:27px;
}

.kpi-value.amber{color:var(--amber);}
.kpi-value.green{color:var(--green);}
.kpi-value.red{color:var(--red);}
.kpi-value.blue{color:var(--blue);}

.kpi-foot{
  font-size:10px;
  color:var(--ink-dim);
  margin-top:6px;
}

/* SECTIONS */

.section-title{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:16px;
  text-transform:uppercase;
  margin:22px 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.see-all{
  font-family:'Inter',sans-serif;
  font-size:11px;
  color:var(--amber);
  text-transform:none;
  cursor:pointer;
}

/* CARD */

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:13px 14px;
  margin-bottom:9px;
}

/* BADGES */

.badge{
  display:inline-flex;
  align-items:center;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:6px;
}

.badge-am{background:#3D2B04;color:var(--amber);}
.badge-pm{background:#052034;color:var(--blue);}
.badge-riposo{background:#232B32;color:var(--ink-dim);}
.badge-ferie{background:#1D1440;color:var(--violet);}
.badge-malattia{background:#3D0D06;color:var(--red);}
.badge-doppio{background:#1D1440;color:var(--violet);}
.badge-ok{background:#04291A;color:var(--green);}
.badge-warn{background:#3D2B04;color:var(--amber);}
.badge-danger{background:#3D0D06;color:var(--red);}
.badge-neutral{background:var(--gray-chip);color:var(--ink-dim);}

/* DRIVER */

.driver-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--surface-3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:14px;
  color:var(--ink-dim);
  flex-shrink:0;
}

.driver-info{
  flex:1;
  min-width:0;
}

.driver-name{
  font-size:14px;
  font-weight:600;
}

.driver-meta{
  font-size:11px;
  color:var(--ink-faint);
  margin-top:2px;
}

.driver-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

.extra-bar-wrap{
  width:56px;
  height:4px;
  background:var(--surface-3);
  border-radius:2px;
  overflow:hidden;
  margin-top:4px;
}

.extra-bar{
  height:100%;
}

/* ROUTE */

.route-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.route-code{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-faint);
}

.route-zone{
  font-size:14px;
  font-weight:600;
  margin-top:2px;
}

.route-time{
  font-size:11px;
  color:var(--ink-dim);
  margin-top:4px;
}

.route-driver{
  font-size:11px;
  color:var(--ink-dim);
  margin-top:7px;
  padding-top:7px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.route-driver b{
  color:var(--ink);
}

.assign-btn{
  color:var(--amber);
  font-weight:600;
  cursor:pointer;
}

/* VAN */

.van-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.van-icon{
  width:38px;
  height:38px;
  border-radius:9px;
  background:var(--surface-3);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.van-plate{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:14px;
}

.van-meta{
  font-size:11px;
  color:var(--ink-faint);
  margin-top:2px;
}

/* BUTTONS */

.btn{
  border:none;
  border-radius:var(--radius);
  padding:11px 16px;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  text-align:center;
}

.btn-primary{
  background:var(--amber);
  color:var(--amber-ink);
  width:100%;
}

.btn-ghost{
  background:var(--surface-2);
  color:var(--ink);
  border:1px solid var(--line);
}

.btn-block{
  width:100%;
  margin-top:14px;
}

.btn-sm{
  padding:7px 10px;
  font-size:11px;
}

.btn-danger-outline{
  background:transparent;
  border:1px solid var(--red);
  color:var(--red);
}

/* NAV */

.bottomnav{
  position:sticky;
  bottom:0;
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex;
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}

.navitem{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:10px 3px 9px;
  cursor:pointer;
  color:var(--ink-faint);
}

.navitem.active{
  color:var(--amber);
}

.navitem svg{
  width:19px;
  height:19px;
}

.navitem span{
  font-size:9px;
  font-weight:600;
  text-transform:uppercase;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(8,11,14,.78);
  z-index:40;
  display:none;
  align-items:flex-end;
}

.overlay.open{
  display:flex;
}

.sheet{
  background:var(--surface);
  border-radius:20px 20px 0 0;
  border:1px solid var(--line);
  border-bottom:none;
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  padding:8px 18px 28px;
  position:relative;
}

.sheet-handle{
  width:36px;
  height:4px;
  background:var(--line);
  border-radius:2px;
  margin:8px auto 14px;
}

.sheet-title{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:20px;
  text-transform:uppercase;
}

.sheet-sub{
  font-size:12px;
  color:var(--ink-dim);
  margin:4px 0 16px;
}

.sheet-close{
  position:absolute;
  top:12px;
  right:16px;
  font-size:22px;
  cursor:pointer;
  color:var(--ink-faint);
}

.shift-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:16px;
}

.shift-opt{
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:10px;
  padding:10px 8px;
  text-align:center;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  color:var(--ink-dim);
}

.shift-opt.sel{
  border-color:var(--amber);
  color:var(--amber);
  background:#241C0B;
}

.toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
}

.t-label{
  font-size:12px;
  font-weight:600;
}

.t-sub{
  font-size:10px;
  color:var(--ink-faint);
  margin-top:2px;
}

.switch{
  width:40px;
  height:23px;
  border-radius:12px;
  background:var(--surface-3);
  position:relative;
  cursor:pointer;
  flex-shrink:0;
}

.switch.on{
  background:var(--amber);
}

.knob{
  width:17px;
  height:17px;
  border-radius:50%;
  background:var(--ink);
  position:absolute;
  top:3px;
  left:3px;
  transition:.15s;
}

.switch.on .knob{
  left:20px;
  background:var(--bg);
}

/* SUGGESTIONS */

.suggest-list{
  margin-top:10px;
}

.suggest-item{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.suggest-rank{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--ink-faint);
}

.suggest-name{
  font-size:12px;
  font-weight:600;
  flex:1;
}

.suggest-tags{
  display:flex;
  gap:4px;
}

.field-label{
  font-size:10px;
  color:var(--ink-faint);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin:14px 0 6px;
}

input[type=text]{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--ink);
  padding:11px 12px;
  font-size:13px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:90px;
  background:var(--surface-3);
  border:1px solid var(--line);
  color:var(--ink);
  font-size:11px;
  padding:9px 14px;
  border-radius:20px;
  z-index:60;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  bottom:100px;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:32px 24px;
}

.login-brand{
  text-align:center;
  margin-bottom:28px;
}

.login-brand .mark{
  width:14px;
  height:14px;
  margin-bottom:10px;
}

.login-brand h1{
  font-size:28px;
  text-transform:uppercase;
}

.login-brand p{
  font-size:11px;
  color:var(--ink-faint);
  margin-top:4px;
}

.login-warn{
  border-left:2px solid var(--amber);
  padding-left:12px;
  font-size:10px;
  color:var(--ink-faint);
  line-height:1.5;
  margin-bottom:22px;
}

.user-pick{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.user-opt{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 13px;
  cursor:pointer;
}

.user-opt.sel{
  border-color:var(--amber);
  background:#241C0B;
}

.role-tag{
  margin-left:auto;
}

.login-error{
  color:var(--red);
  font-size:11px;
  margin-top:10px;
  text-align:center;
  min-height:16px;
}

.admin-warn{
  border-left:2px solid var(--amber);
  padding-left:12px;
  font-size:10px;
  color:var(--ink-faint);
  line-height:1.5;
}

.log-item{
  border-bottom:1px solid var(--line);
  padding:9px 0;
  font-size:11px;
  color:var(--ink-dim);
}

.log-meta{
  font-size:9px;
  color:var(--ink-faint);
  margin-top:2px;
}

.empty{
  text-align:center;
  padding:25px 10px;
  color:var(--ink-faint);
  font-size:12px;
}

@media(min-width:760px){
  .topbar{
    padding:20px 28px 14px;
  }

  .operational-strip{
    margin-left:28px;
    margin-right:28px;
  }

  .screen{
    padding:22px 28px 110px;
    width:100%;
  }

  .kpi-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .bottomnav{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:min(1180px,100%);
  }
}
</style>
</head>

<body>

<div id="login-root"></div>

<div id="app">

  <div class="topbar">
    <div class="topbar-row">

      <div class="brand">
        <span class="mark"></span>
        <div>
          <div class="brand-title">CAP Delivery</div>
          <div class="brand-sub">Console operativa · Demo</div>
        </div>
      </div>

      <div class="date-chip">
        <b id="today-date"></b>
        <div class="userbar">
          <span id="userbar-name" class="userbar-name"></span>
          <span class="logout-link" onclick="logout()">Esci</span>
        </div>

        <div class="sync-chip">
          <span class="sync-dot"></span>
          <span>Salvataggio locale</span>
        </div>
      </div>

    </div>

    <div class="ticker" id="ticker" onclick="goTo('giri')">
      <span class="ticker-dot"></span>
      <span class="ticker-text" id="ticker-text"></span>
      <span class="ticker-arrow">›</span>
    </div>
  </div>

  <div class="operational-strip">
    <span class="live">OPERATIVO</span>
    <span>·</span>
    <span>Vista giornaliera</span>
    <span>·</span>
    <span>Turni, giri e flotta</span>
  </div>

  <div class="screen" id="screen"></div>

  <div class="bottomnav">

    <div class="navitem" data-tab="dashboard" onclick="goTo('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="9" rx="1.5"/>
        <rect x="14" y="3" width="7" height="5" rx="1.5"/>
        <rect x="14" y="12" width="7" height="9" rx="1.5"/>
        <rect x="3" y="16" width="7" height="5" rx="1.5"/>
      </svg>
      <span>Dashboard</span>
    </div>

    <div class="navitem" data-tab="turni" onclick="goTo('turni')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3.5 2"/>
      </svg>
      <span>Turni</span>
    </div>

    <div class="navitem" data-tab="giri" onclick="goTo('giri')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12h13"/>
        <path d="M12 6l6 6-6 6"/>
      </svg>
      <span>Giri</span>
    </div>

    <div class="navitem" data-tab="autisti" onclick="goTo('autisti')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="8" r="3.2"/>
        <path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/>
      </svg>
      <span>Autisti</span>
    </div>

    <div class="navitem" data-tab="flotta" onclick="goTo('flotta')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 16V9a1 1 0 0 1 1-1h9l4 4h3a1 1 0 0 1 1 1v3"/>
        <circle cx="7.5" cy="17" r="2"/>
        <circle cx="17.5" cy="17" r="2"/>
      </svg>
      <span>Flotta</span>
    </div>

    <div class="navitem" id="admin-navitem" data-tab="admin" onclick="goTo('admin')" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5l8-3z"/>
      </svg>
      <span>Admin</span>
    </div>

  </div>

  <div class="overlay" id="overlay" onclick="closeSheetOnBackdrop(event)">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script>
const STORAGE_KEY = 'cap-delivery-demo-state-v3';
const SESSION_KEY = 'cap-delivery-demo-user-v3';

function defaultState(){

    drivers:[
      {id:'d1',name:'Marco Bellini',initials:'MB',shift:'AM',doubleOK:true,extra:6,status:'in_servizio',phone:'333 100 2001'},
      {id:'d2',name:'Sara Conti',initials:'SC',shift:'AM',doubleOK:false,extra:2,status:'in_servizio',phone:'333 100 2002'},
      {id:'d3',name:'Luca Ferri',initials:'LF',shift:'PM',doubleOK:true,extra:11,status:'in_servizio',phone:'333 100 2003'},
      {id:'d4',name:'Giulia Moro',initials:'GM',shift:'MALATTIA',doubleOK:false,extra:0,status:'assente',phone:'333 100 2004'},
      {id:'d5',name:'Andrea Ricci',initials:'AR',shift:'RIPOSO',doubleOK:true,extra:1,status:'disponibile',phone:'333 100 2005'},
      {id:'d6',name:'Elena Fabbri',initials:'EF',shift:'PM',doubleOK:false,extra:8,status:'in_servizio',phone:'333 100 2006'},
      {id:'d7',name:'Davide Greco',initials:'DG',shift:'FERIE',doubleOK:false,extra:0,status:'assente',phone:'333 100 2007'},
      {id:'d8',name:'Chiara Villa',initials:'CV',shift:'RIPOSO',doubleOK:false,extra:4,status:'disponibile',phone:'333 100 2008'},
      {id:'d9',name:'Paolo Neri',initials:'PN',shift:'DOPPIO',doubleOK:true,extra:14,status:'in_servizio',phone:'333 100 2009'},
      {id:'d10',name:'Federica Rossi',initials:'FR',shift:'AM',doubleOK:true,extra:3,status:'in_servizio',phone:'333 100 2010'}
    ],

    routes:[
      {id:'g1',code:'GR-014',zone:'Milano Nord — Bicocca / Niguarda',time:'08:00 – 12:30',driver:'d1',status:'in_corso'},
      {id:'g2',code:'GR-015',zone:'Milano Centro — Duomo / Brera',time:'08:00 – 12:00',driver:'d2',status:'in_corso'},
      {id:'g3',code:'GR-018',zone:'Milano Sud — Ripamonti',time:'14:00 – 18:30',driver:'d3',status:'programmato'},
      {id:'g4',code:'GR-021',zone:'Sesto San Giovanni',time:'14:00 – 18:00',driver:null,status:'scoperto'},
      {id:'g5',code:'GR-022',zone:'Cinisello Balsamo',time:'14:30 – 19:00',driver:'d6',status:'programmato'},
      {id:'g6',code:'GR-023',zone:'Monza centro',time:'16:00 – 20:00',driver:'d9',status:'programmato'}
    ],

    vans:[
      {id:'v1',plate:'FN 442 GT',status:'operativo',driver:'d1',km:81200,note:''},
      {id:'v2',plate:'FN 118 BR',status:'operativo',driver:'d2',km:64300,note:''},
      {id:'v3',plate:'FN 903 CL',status:'guasto',driver:null,km:112500,note:'Perdita liquido freni — officina Rota'},
      {id:'v4',plate:'FN 227 DK',status:'manutenzione',driver:null,km:97800,note:'Tagliando programmato, rientro ore 17:00'},
      {id:'v5',plate:'FN 560 PW',status:'operativo',driver:'d3',km:45200,note:''},
      {id:'v6',plate:'FN 335 QE',status:'fermo',driver:null,km:73100,note:'Nessun autista disponibile per il turno'}
    ],

    emergencies:[
      {id:'e1',type:'guasto',text:'FN 903 CL — guasto freni, autista rientrato in deposito',open:true},
      {id:'e2',type:'giro',text:'GR-021 Sesto S.G. scoperto per il turno pomeridiano',open:true}
    ],

    users:[
      {id:'u1',name:'Amministratore',role:'admin',pin:'1234'},
      {id:'u2',name:'Dispatcher Turno',role:'dispatcher',pin:'0000'}
    ],

    activityLog:[]
  };
}

let state = defaultState();
let currentUser = null;
let loginSelectedUser = null;
let pendingRouteForAssign = null;
let pickedRole = 'dispatcher';

const SHIFT_LABELS = {
  AM:'Mattina',
  PM:'Pomeriggio',
  RIPOSO:'Riposo',
  FERIE:'Ferie',
  MALATTIA:'Malattia',
  DOPPIO:'Doppio turno'
};

const SHIFT_BADGE_CLASS = {
  AM:'badge-am',
  PM:'badge-pm',
  RIPOSO:'badge-riposo',
  FERIE:'badge-ferie',
  MALATTIA:'badge-malattia',
  DOPPIO:'badge-doppio'
};

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.warn('Salvataggio locale non disponibile', e);
  }
}

function loadState(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      const parsed = JSON.parse(saved);
      state = Object.assign(defaultState(), parsed);
    }else{
      state = defaultState();
      saveState();
    }
  }catch(e){
    state = defaultState();
    console.warn('Caricamento locale non disponibile', e);
  }
}

function saveSession(){
  try{
    if(currentUser){
      localStorage.setItem(SESSION_KEY,currentUser.id);
    }
  }catch(e){}
}

function clearSession(){
  try{
    localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}

function restoreSession(){
  try{
    const id = localStorage.getItem(SESSION_KEY);

    if(id){
      currentUser = state.users.find(u=>u.id===id) || null;
    }
  }catch(e){}
}

function driverById(id){
  return state.drivers.find(d=>d.id===id);
}

function fmtDate(){
  const d = new Date();

  return d.toLocaleDateString('it-IT',{
    weekday:'long',
    day:'numeric',
    month:'long'
  });
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function showToast(msg){
  const el = document.getElementById('toast');

  el.textContent = msg;
  el.classList.add('show');

  setTimeout(()=>{
    el.classList.remove('show');
  },1900);
}

function logAction(desc){
  state.activityLog = state.activityLog || [];

  state.activityLog.unshift({
    ts:new Date().toISOString(),
    user:currentUser ? currentUser.name : 'Sistema',
    role:currentUser ? currentUser.role : 'system',
    desc
  });

  state.activityLog = state.activityLog.slice(0,100);
  saveState();
}

/* LOGIN */

function renderLogin(){
  const root = document.getElementById('login-root');

  let users='';

  state.users.forEach(u=>{
    users += `
      <div class="user-opt ${loginSelectedUser===u.id?'sel':''}"
           onclick="selectLoginUser('${u.id}')">

        <div class="avatar">
          ${escapeHtml(u.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}
        </div>

        <div>
          <div class="driver-name">${escapeHtml(u.name)}</div>
          <div class="driver-meta">${u.role==='admin'?'Amministratore':'Dispatcher'}</div>
        </div>

        <span class="badge ${u.role==='admin'?'badge-danger':'badge-neutral'} role-tag">
          ${u.role==='admin'?'Admin':'Dispatcher'}
        </span>
      </div>
    `;
  });

  root.innerHTML = `
    <div class="login-screen">

      <div class="login-brand">
        <span class="mark"></span>
        <h1>CAP Delivery</h1>
        <p>Console operativa · Demo</p>
      </div>

      <div class="login-warn">
        Versione dimostrativa. I dati vengono salvati solo su questo dispositivo.
        Non inserire dati aziendali reali.
      </div>

      <div class="field-label">Seleziona utente</div>

      <div class="user-pick">
        ${users}
      </div>

      <div class="field-label">PIN</div>

      <input
        type="text"
        inputmode="numeric"
        id="login-pin"
        maxlength="4"
        placeholder="····"
      >

      <button class="btn btn-primary btn-block" onclick="attemptLogin()">
        Accedi
      </button>

      <div class="login-error" id="login-error"></div>

      <div style="text-align:center;margin-top:22px;font-size:10px;color:var(--ink-faint)">
        Demo: Admin 1234 · Dispatcher 0000
      </div>

    </div>
  `;
}

function selectLoginUser(id){
  loginSelectedUser=id;
  renderLogin();

  setTimeout(()=>{
    const input=document.getElementById('login-pin');
    if(input) input.focus();
  },20);
}

function attemptLogin(){
  const input=document.getElementById('login-pin');
  const error=document.getElementById('login-error');

  const pin=input ? input.value.trim() : '';
  const user=state.users.find(u=>u.id===loginSelectedUser);

  if(!user){
    error.textContent='Seleziona un utente.';
    return;
  }

  if(user.pin!==pin){
    error.textContent='PIN non corretto.';
    return;
  }

  currentUser=user;
  saveSession();
  logAction('Accesso effettuato');
  showApp();
}

function logout(){
  logAction('Disconnessione effettuata');
  currentUser=null;
  clearSession();

  document.getElementById('app').style.display='none';
  document.getElementById('login-root').style.display='block';

  loginSelectedUser=null;
  renderLogin();
}

function showApp(){
  document.getElementById('login-root').style.display='none';
  document.getElementById('app').style.display='flex';

  document.getElementById('today-date').textContent =
    fmtDate().charAt(0).toUpperCase()+fmtDate().slice(1);

  document.getElementById('userbar-name').textContent =
    currentUser.name+' · '+(currentUser.role==='admin'?'Admin':'Dispatcher');

  document.getElementById('admin-navitem').style.display =
    currentUser.role==='admin' ? 'flex' : 'none';

  if(state.tab==='admin' && currentUser.role!=='admin'){
    state.tab='dashboard';
  }

  goTo(state.tab || 'dashboard');
}

/* NAV */

function goTo(tab){
  if(tab==='admin' && (!currentUser || currentUser.role!=='admin')){
    return;
  }

  state.tab=tab;

  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active',el.dataset.tab===tab);
  });

  render();
  saveState();

  const screen=document.getElementById('screen');

  if(screen){
    screen.scrollTop=0;
  }
}

/* RENDER */

function render(){
  renderTicker();

  const screen=document.getElementById('screen');

  if(state.tab==='dashboard') screen.innerHTML=renderDashboard();
  if(state.tab==='turni') screen.innerHTML=renderTurni();
  if(state.tab==='giri') screen.innerHTML=renderGiri();
  if(state.tab==='autisti') screen.innerHTML=renderAutisti();
  if(state.tab==='flotta') screen.innerHTML=renderFlotta();
  if(state.tab==='admin') screen.innerHTML=renderAdmin();
}

function renderTicker(){
  const open=state.emergencies.filter(e=>e.open);
  const ticker=document.getElementById('ticker');

  if(!ticker) return;

  if(open.length===0){
    ticker.classList.add('hidden');
    return;
  }

  ticker.classList.remove('hidden');

  document.getElementById('ticker-text').innerHTML=
    `<b>${open.length} emergenz${open.length===1?'a':'e'} aperte</b> — ${escapeHtml(open[0].text)}`;
}

/* DASHBOARD */

function kpi(label,value,color,foot){
  return `
    <div class="kpi-card">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value ${color}">${value}</div>
      <div class="kpi-foot">${foot}</div>
    </div>
  `;
}

function renderDashboard(){
  const giriAttivi=state.routes.filter(r=>
    r.status==='in_corso' || r.status==='programmato'
  ).length;

  const disponibili=state.drivers.filter(d=>
    d.status==='disponibile'
  ).length;

  const furgOperativi=state.vans.filter(v=>
    v.status==='operativo'
  ).length;

  const emergenze=state.emergencies.filter(e=>e.open).length;

  let html=`
    <div class="kpi-grid">
      ${kpi('Giri operativi',giriAttivi,'amber',state.routes.length+' totali pianificati')}
      ${kpi('Autisti disponibili',disponibili,'green','su '+state.drivers.length+' in organico')}
      ${kpi('Furgoni operativi',furgOperativi+'/'+state.vans.length,'blue',(state.vans.length-furgOperativi)+' non operativi')}
      ${kpi('Emergenze aperte',emergenze,emergenze?'red':'green',emergenze?'richiedono azione':'nessuna criticità')}
    </div>

    <div class="section-title">
      Copertura giri
      <span class="see-all" onclick="goTo('giri')">Vedi tutti ›</span>
    </div>
  `;

  const scoperti=state.routes.filter(r=>r.status==='scoperto');

  if(scoperti.length){
    scoperti.forEach(r=>html+=routeCard(r));
  }else{
    html+=`<div class="card"><div class="driver-meta">Tutti i giri sono coperti.</div></div>`;
  }

  html+=`
    <div class="section-title">
      Assenze di oggi
      <span class="see-all" onclick="goTo('turni')">Vedi tutti ›</span>
    </div>
  `;

  const assenti=state.drivers.filter(d=>
    d.shift==='MALATTIA' || d.shift==='FERIE'
  );

  if(assenti.length){
    assenti.forEach(d=>html+=driverCard(d,false));
  }else{
    html+=`<div class="card"><div class="driver-meta">Nessuna assenza registrata.</div></div>`;
  }

  html+=`
    <div class="section-title">
      Flotta — stato rapido
      <span class="see-all" onclick="goTo('flotta')">Vedi tutti ›</span>
    </div>
  `;

  const critici=state.vans.filter(v=>v.status!=='operativo');

  if(critici.length){
    critici.forEach(v=>html+=vanCard(v,false));
  }

  return html;
}

/* DRIVER */

function renderTurni(){
  const order={
    AM:0,
    PM:1,
    DOPPIO:2,
    RIPOSO:3,
    FERIE:4,
    MALATTIA:5
  };

  let html=`<div class="section-title">Turni di oggi</div>`;

  [...state.drivers]
    .sort((a,b)=>order[a.shift]-order[b.shift])
    .forEach(d=>{
      html+=driverCard(d,true);
    });

  return html;
}

function driverCard(d,clickable){
  const percentage=Math.min(100,Math.round((d.extra/16)*100));

  const barColor=
    d.extra>=10?'var(--red)':
    d.extra>=5?'var(--amber)':
    'var(--green)';

  return `
    <div class="card" ${clickable?`onclick="openShiftSheet('${d.id}')"`:''}>
      <div class="driver-row">

        <div class="avatar">${escapeHtml(d.initials)}</div>

        <div class="driver-info">
          <div class="driver-name">${escapeHtml(d.name)}</div>

          <div class="driver-meta">
            Extra mese: ${d.extra} h
            ${d.doubleOK?' · disponibile a doppio turno':''}
          </div>

          <div class="extra-bar-wrap">
            <div
              class="extra-bar"
              style="width:${percentage}%;background:${barColor}">
            </div>
          </div>
        </div>

        <div class="driver-right">
          <span class="badge ${SHIFT_BADGE_CLASS[d.shift]}">
            ${SHIFT_LABELS[d.shift]}
          </span>
        </div>

      </div>
    </div>
  `;
}

function openShiftSheet(id){
  const d=driverById(id);

  const shifts=['AM','PM','DOPPIO','RIPOSO','FERIE','MALATTIA'];

  let options='';

  shifts.forEach(s=>{
    options+=`
      <div
        class="shift-opt ${d.shift===s?'sel':''}"
        onclick="setShift('${id}','${s}')">
        ${SHIFT_LABELS[s]}
      </div>
    `;
  });

  let html=`
    <div class="sheet-close" onclick="closeSheet()">×</div>
    <div class="sheet-handle"></div>

    <div class="sheet-title">${escapeHtml(d.name)}</div>

    <div class="sheet-sub">
      ${escapeHtml(d.phone)} · Extra mese ${d.extra} h
    </div>

    <div class="field-label">Assegna turno</div>

    <div class="shift-grid">
      ${options}
    </div>

    <div class="toggle-row">
      <div>
        <div class="t-label">Disponibile a doppio turno</div>
        <div class="t-sub">
          Priorità nelle proposte, senza escludere gli altri
        </div>
      </div>

      <div
        class="switch ${d.doubleOK?'on':''}"
        onclick="toggleDouble('${id}')">
        <div class="knob"></div>
      </div>
    </div>
  `;

  if(d.shift==='MALATTIA'){
    html+=`
      <div class="field-label">Sostituzione consigliata</div>
      ${renderSuggestions(id,'malattia')}
    `;
  }

  html+=`
    <button class="btn btn-primary btn-block" onclick="closeSheet()">
      Fatto
    </button>
  `;

  openSheet(html);
}

function setShift(id,shift){
  const d=driverById(id);
  const previous=d.shift;

  d.shift=shift;

  if(shift==='RIPOSO'){
    d.status='disponibile';
  }else if(shift==='FERIE' || shift==='MALATTIA'){
    d.status='assente';
  }else{
    d.status='in_servizio';
  }

  if(shift==='MALATTIA' && previous!=='MALATTIA'){
    state.emergencies.unshift({
      id:'e'+Date.now(),
      type:'malattia',
      text:d.name+' — assenza per malattia da coprire',
      open:true
    });
  }

  logAction('Turno di '+d.name+' impostato su '+SHIFT_LABELS[shift]);

  saveState();
  render();
  openShiftSheet(id);
}

function toggleDouble(id){
  const d=driverById(id);

  d.doubleOK=!d.doubleOK;

  logAction(
    'Disponibilità doppio turno di '+d.name+
    ': '+(d.doubleOK?'sì':'no')
  );

  saveState();
  render();
  openShiftSheet(id);
}

/* SUGGESTIONS */

function suggestDrivers(excludeId){
  return state.drivers
    .filter(d=>
      d.id!==excludeId &&
      d.shift!=='FERIE' &&
      d.shift!=='MALATTIA' &&
      (
        d.status==='disponibile' ||
        (
          d.status==='in_servizio' &&
          d.shift!=='DOPPIO'
        )
      )
    )
    .sort((a,b)=>{
      if(a.doubleOK!==b.doubleOK){
        return a.doubleOK ? -1 : 1;
      }

      return a.extra-b.extra;
    })
    .slice(0,4);
}

function renderSuggestions(excludeId,context){
  const list=suggestDrivers(excludeId);

  if(!list.length){
    return `<div class="empty">Nessun autista disponibile.</div>`;
  }

  let html=`<div class="suggest-list">`;

  list.forEach((d,index)=>{
    html+=`
      <div class="suggest-item">

        <span class="suggest-rank">${index+1}</span>

        <span class="suggest-name">
          ${escapeHtml(d.name)}
        </span>

        <div class="suggest-tags">
          ${d.doubleOK?`<span class="badge badge-doppio">Doppio ok</span>`:''}
          <span class="badge badge-neutral">${d.extra} h</span>
        </div>

        <button
          class="btn btn-primary btn-sm"
          onclick="event.stopPropagation();assignSuggestion('${d.id}','${context}')">
          Assegna
        </button>

      </div>
    `;
  });

  html+=`</div>`;

  return html;
}

function assignSuggestion(driverId,context){
  const d=driverById(driverId);

  if(context==='malattia'){
    showToast(d.name+' è il sostituto consigliato');
    return;
  }

  if(context==='giro' && pendingRouteForAssign){
    const r=state.routes.find(r=>r.id===pendingRouteForAssign);

    r.driver=driverId;
    r.status='programmato';

    if(d.status==='disponibile'){
      d.shift='DOPPIO';
      d.status='in_servizio';
      d.extra+=3;
    }

    state.emergencies.forEach(e=>{
      if(e.text.includes(r.code)){
        e.open=false;
      }
    });

    logAction('Giro '+r.code+' assegnato a '+d.name);

    saveState();
    closeSheet();
    render();

    showToast('Giro '+r.code+' assegnato a '+d.name);
  }
}

/* GIRI */

function renderGiri(){
  let html=`
    <button
      class="btn btn-primary btn-block"
      style="margin:0 0 16px"
      onclick="openUrgentRouteSheet()">
      + Aggiungi giro urgente
    </button>
  `;

  const groups=[
    ['scoperto','Scoperti'],
    ['in_corso','In corso'],
    ['programmato','Programmati'],
    ['completato','Completati']
  ];

  groups.forEach(([status,label])=>{
    const items=state.routes.filter(r=>r.status===status);

    if(!items.length) return;

    html+=`<div class="section-title">${label}</div>`;

    items.forEach(r=>{
      html+=routeCard(r);
    });
  });

  return html;
}

function routeCard(r){
  const badge={
    scoperto:`<span class="badge badge-danger">Scoperto</span>`,
    in_corso:`<span class="badge badge-ok">In corso</span>`,
    programmato:`<span class="badge badge-neutral">Programmato</span>`,
    completato:`<span class="badge badge-neutral">Completato</span>`
  }[r.status];

  const d=r.driver ? driverById(r.driver) : null;

  return `
    <div class="card">

      <div class="route-top">

        <div>
          <div class="route-code">${escapeHtml(r.code)}</div>
          <div class="route-zone">${escapeHtml(r.zone)}</div>
          <div class="route-time">${escapeHtml(r.time)}</div>
        </div>

        ${badge}

      </div>

      <div class="route-driver">

        ${
          d
          ? `Autista: <b>${escapeHtml(d.name)}</b>`
          : `<span style="color:var(--red)">Nessun autista assegnato</span>`
        }

        ${
          !d || r.status==='scoperto'
          ? `<span class="assign-btn" onclick="openAssignRouteSheet('${r.id}')">Assegna ›</span>`
          : ''
        }

      </div>

    </div>
  `;
}

function openAssignRouteSheet(routeId){
  pendingRouteForAssign=routeId;

  const r=state.routes.find(r=>r.id===routeId);

  openSheet(`
    <div class="sheet-close" onclick="closeSheet()">×</div>
    <div class="sheet-handle"></div>

    <div class="sheet-title">
      Assegna ${escapeHtml(r.code)}
    </div>

    <div class="sheet-sub">
      ${escapeHtml(r.zone)} · ${escapeHtml(r.time)}
    </div>

    <div class="field-label">
      Autisti proposti
    </div>

    ${renderSuggestions(null,'giro')}

    <button class="btn btn-ghost btn-block" onclick="closeSheet()">
      Annulla
    </button>
  `);
}

function nextRouteCode(){
  const nums=state.routes.map(r=>{
    const match=r.code.match(/GR-0*(\d+)/);
    return match ? parseInt(match[1],10) : 0;
  });

  const next=(nums.length ? Math.max(...nums) : 0)+1;

  return 'GR-'+String(next).padStart(3,'0');
}

function openUrgentRouteSheet(){
  openSheet(`
    <div class="sheet-close" onclick="closeSheet()">×</div>
    <div class="sheet-handle"></div>

    <div class="sheet-title">
      Giro urgente
    </div>

    <div class="sheet-sub">
      Aggiungi un giro last-minute e scegli l'autista più adatto.
    </div>

    <div class="field-label">Zona</div>

    <input
      type="text"
      id="urg-zone"
      placeholder="Es. Bresso / Cormano"
    >

    <div class="field-label">Fascia oraria</div>

    <input
      type="text"
      id="urg-time"
      placeholder="Es. 18:00 – 21:00"
    >

    <div class="field-label">Autisti proposti</div>

    ${renderUrgentSuggestions()}

    <button class="btn btn-ghost btn-block" onclick="closeSheet()">
      Annulla
    </button>
  `);
}

function renderUrgentSuggestions(){
  const list=suggestDrivers(null);

  if(!list.length){
    return `<div class="empty">Nessun autista disponibile.</div>`;
  }

  let html=`<div class="suggest-list">`;

  list.forEach((d,index)=>{
    html+=`
      <div class="suggest-item">

        <span class="suggest-rank">${index+1}</span>

        <span class="suggest-name">
          ${escapeHtml(d.name)}
        </span>

        <div class="suggest-tags">
          ${
            d.doubleOK
            ? `<span class="badge badge-doppio">Doppio ok</span>`
            : `<span class="badge badge-neutral">No doppio</span>`
          }

          <span class="badge badge-neutral">
            ${d.extra} h
          </span>
        </div>

        <button
          class="btn btn-primary btn-sm"
          onclick="createUrgentRoute('${d.id}')">
          Assegna
        </button>

      </div>
    `;
  });

  html+=`</div>`;

  return html;
}

function createUrgentRoute(driverId){
  const zoneInput=document.getElementById('urg-zone');
  const timeInput=document.getElementById('urg-time');

  const zone=
    zoneInput && zoneInput.value.trim()
    ? zoneInput.value.trim()
    : 'Zona da definire';

  const time=
    timeInput && timeInput.value.trim()
    ? timeInput.value.trim()
    : 'Orario da definire';

  const d=driverById(driverId);
  const code=nextRouteCode();

  state.routes.push({
    id:'g'+Date.now(),
    code,
    zone,
    time,
    driver:driverId,
    status:'programmato'
  });

  if(d.status==='disponibile' || d.shift!=='DOPPIO'){
    d.shift='DOPPIO';
    d.status='in_servizio';
    d.extra+=3;
  }

  logAction('Giro urgente '+code+' assegnato a '+d.name);

  saveState();
  closeSheet();
  render();

  showToast(code+' assegnato a '+d.name);
}

/* AUTISTI */

function renderAutisti(){
  let html=`
    <div class="section-title">
      Autisti — riequilibrio ore extra
    </div>
  `;

  [...state.drivers]
    .sort((a,b)=>b.extra-a.extra)
    .forEach(d=>{
      html+=driverCard(d,true);
    });

  return html;
}

/* FLOTTA */

function renderFlotta(){
  let html='';

  const groups=[
    ['guasto','Guasti'],
    ['manutenzione','In manutenzione'],
    ['fermo','Fermi'],
    ['operativo','Operativi']
  ];

  groups.forEach(([status,label])=>{
    const items=state.vans.filter(v=>v.status===status);

    if(!items.length) return;

    html+=`
      <div class="section-title">
        ${label} (${items.length})
      </div>
    `;

    items.forEach(v=>{
      html+=vanCard(v,true);
    });
  });

  return html;
}

function vanCard(v,clickable){
  const badge={
    operativo:`<span class="badge badge-ok">Operativo</span>`,
    guasto:`<span class="badge badge-danger">Guasto</span>`,
    manutenzione:`<span class="badge badge-warn">Manutenzione</span>`,
    fermo:`<span class="badge badge-neutral">Fermo</span>`
  }[v.status];

  const d=v.driver ? driverById(v.driver) : null;

  return `
    <div class="card" ${clickable?`onclick="openVanSheet('${v.id}')"`:''}>

      <div class="van-row">

        <div class="van-icon">
          🚚
        </div>

        <div class="driver-info">

          <div class="van-plate">
            ${escapeHtml(v.plate)}
          </div>

          <div class="van-meta">
            ${v.km.toLocaleString('it-IT')} km
            ${d?' · '+escapeHtml(d.name):''}
            ${v.note?' · '+escapeHtml(v.note):''}
          </div>

        </div>

        ${badge}

      </div>

    </div>
  `;
}

function openVanSheet(id){
  const v=state.vans.find(v=>v.id===id);

  const statuses=[
    ['operativo','Operativo'],
    ['guasto','Guasto'],
    ['manutenzione','Manutenzione'],
    ['fermo','Fermo']
  ];

  let options='';

  statuses.forEach(([status,label])=>{
    options+=`
      <div
        class="shift-opt ${v.status===status?'sel':''}"
        onclick="setVanStatus('${id}','${status}')">
        ${label}
      </div>
    `;
  });

  openSheet(`
    <div class="sheet-close" onclick="closeSheet()">×</div>
    <div class="sheet-handle"></div>

    <div class="sheet-title">
      ${escapeHtml(v.plate)}
    </div>

    <div class="sheet-sub">
      ${v.km.toLocaleString('it-IT')} km percorsi
    </div>

    <div class="field-label">
      Stato mezzo
    </div>

    <div class="shift-grid">
      ${options}
    </div>

    <div class="field-label">
      Nota
    </div>

    <input
      type="text"
      id="van-note"
      value="${escapeHtml(v.note || '')}"
      placeholder="Es. In attesa di ricambio"
    >

    <button
      class="btn btn-primary btn-block"
      onclick="saveVanNote('${id}')">
      Salva
    </button>
  `);
}

function setVanStatus(id,status){
  const v=state.vans.find(v=>v.id===id);
  const old=v.status;

  v.status=status;

  if(status==='guasto' && old!=='guasto'){
    state.emergencies.unshift({
      id:'e'+Date.now(),
      type:'guasto',
      text:v.plate+' — segnalato guasto',
      open:true
    });
  }

  logAction('Stato '+v.plate+' impostato su '+status);

  saveState();
  render();
  openVanSheet(id);
}

function saveVanNote(id){
  const v=state.vans.find(v=>v.id===id);
  const input=document.getElementById('van-note');

  v.note=input ? input.value.trim() : '';

  logAction('Nota furgone '+v.plate+' aggiornata');

  saveState();
  closeSheet();
  render();

  showToast('Furgone aggiornato');
}

/* ADMIN */

function renderAdmin(){
  let html=`
    <div class="admin-warn">
      AREA AMMINISTRAZIONE — DEMO.
      In una versione aziendale reale autenticazione, utenti,
      ruoli e audit saranno gestiti da backend sicuro.
    </div>

    <div class="section-title">
      Utenti
      <span class="see-all" onclick="openUserSheet(null)">
        + Aggiungi ›
      </span>
    </div>
  `;

  state.users.forEach(u=>{
    html+=`
      <div class="card" onclick="openUserSheet('${u.id}')">

        <div class="driver-row">

          <div class="avatar">
            ${escapeHtml(u.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}
          </div>

          <div class="driver-info">
            <div class="driver-name">
              ${escapeHtml(u.name)}
            </div>

            <div class="driver-meta">
              PIN ····
            </div>
          </div>

          <span class="badge ${u.role==='admin'?'badge-danger':'badge-neutral'}">
            ${u.role==='admin'?'Admin':'Dispatcher'}
          </span>

        </div>

      </div>
    `;
  });

  html+=`
    <div class="section-title">
      Log attività
    </div>
  `;

  const log=(state.activityLog || []).slice(0,30);

  if(!log.length){
    html+=`
      <div class="card">
        <div class="driver-meta">
          Nessuna attività registrata.
        </div>
      </div>
    `;
  }else{
    html+=`<div class="card">`;

    log.forEach(item=>{
      const date=new Date(item.ts);

      html+=`
        <div class="log-item">

          ${escapeHtml(item.desc)}

          <div class="log-meta">
            ${escapeHtml(item.user)}
            ·
            ${isNaN(date)?'':date.toLocaleString('it-IT')}
          </div>

        </div>
      `;
    });

    html+=`</div>`;
  }

  html+=`
    <div class="section-title">
      Dati demo
    </div>

    <div class="card">
      <button
        class="btn btn-danger-outline btn-block"
        onclick="resetData()">
        Ripristina dati di esempio
      </button>
    </div>
  `;

  return html;
}

function openUserSheet(id){
  const user=id ? state.users.find(u=>u.id===id) : null;

  pickedRole=user ? user.role : 'dispatcher';

  openSheet(`
    <div class="sheet-close" onclick="closeSheet()">×</div>
    <div class="sheet-handle"></div>

    <div class="sheet-title">
      ${user?escapeHtml(user.name):'Nuovo utente'}
    </div>

    <div class="sheet-sub">
      Accesso dimostrativo
    </div>

    <div class="field-label">
      Nome
    </div>

    <input
      type="text"
      id="user-name"
      value="${user?escapeHtml(user.name):''}"
      placeholder="Mario Rossi"
    >

    <div class="field-label">
      Ruolo
    </div>

    <div class="shift-grid">

      <div
        id="role-admin"
        class="shift-opt ${pickedRole==='admin'?'sel':''}"
        onclick="pickRole('admin')">
        Admin
      </div>

      <div
        id="role-dispatcher"
        class="shift-opt ${pickedRole==='dispatcher'?'sel':''}"
        onclick="pickRole('dispatcher')">
        Dispatcher
      </div>

    </div>

    <div class="field-label">
      PIN — 4 cifre
    </div>

    <input
      type="text"
      inputmode="numeric"
      maxlength="4"
      id="user-pin"
      value="${user?escapeHtml(user.pin):''}"
      placeholder="0000"
    >

    <button
      class="btn btn-primary btn-block"
      onclick="saveUser('${user?user.id:''}')">
      Salva
    </button>

    ${
      user && currentUser && user.id!==currentUser.id
      ? `
        <button
          class="btn btn-danger-outline btn-block"
          onclick="deleteUser('${user.id}')">
          Elimina utente
        </button>
      `
      : ''
    }
  `);
}

function pickRole(role){
  pickedRole=role;

  document.getElementById('role-admin')
    .classList.toggle('sel',role==='admin');

  document.getElementById('role-dispatcher')
    .classList.toggle('sel',role==='dispatcher');
}

function saveUser(id){
  const name=document.getElementById('user-name').value.trim();
  const pin=document.getElementById('user-pin').value.trim();

  if(!name || !/^\d{4}$/.test(pin)){
    showToast('Inserisci nome e PIN di 4 cifre');
    return;
  }

  if(id){
    const user=state.users.find(u=>u.id===id);

    if(user){
      user.name=name;
      user.pin=pin;
      user.role=pickedRole;
    }

    logAction('Utente modificato: '+name);
  }else{
    state.users.push({
      id:'u'+Date.now(),
      name,
      pin,
      role:pickedRole
    });

    logAction('Utente creato: '+name);
  }

  saveState();
  closeSheet();
  render();

  showToast('Utente salvato');
}

function deleteUser(id){
  const user=state.users.find(u=>u.id===id);

  state.users=state.users.filter(u=>u.id!==id);

  logAction('Utente eliminato: '+(user?user.name:id));

  saveState();
  closeSheet();
  render();

  showToast('Utente eliminato');
}

function resetData(){
  if(!currentUser || currentUser.role!=='admin'){
    return;
  }

  const users=state.users;

  state=defaultState();
  state.users=users;

  logAction('Dati demo ripristinati');

  saveState();
  goTo('dashboard');

  showToast('Dati ripristinati');
}

/* SHEETS */

function openSheet(html){
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  pendingRouteForAssign=null;
}

function closeSheetOnBackdrop(event){
  if(event.target.id==='overlay'){
    closeSheet();
  }
}

/* INIT */

function init(){
  loadState();
  restoreSession();

  if(currentUser){
    showApp();
  }else{
    document.getElementById('login-root').style.display='block';
    renderLogin();
  }
}

init();
</script>
